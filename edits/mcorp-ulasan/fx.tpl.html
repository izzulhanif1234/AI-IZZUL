          <div id="fx-rm-n">RM0</div>
          <div id="fx-rm-bar"><div id="fx-rm-fill"></div></div>
        </div>
        <div id="fx-br1" class="fx">
          <div class="br-k">JABATAN TANPA LATAR TEKNIKAL</div>
          <div class="br-ok"><svg viewBox="0 0 24 24" fill="none" stroke="#062612" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>SANGAT MEMBANTU</div>
        </div>

        <!-- 04 harapan -->
        <div id="fx-rec" class="fx">
          <svg viewBox="0 0 24 24" fill="#111"><path d="M2 21h4V10H2zm20-10c0-1.1-.9-2-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.4-1.1L13.2 2 6.6 8.6c-.4.4-.6.9-.6 1.4v9c0 1.1.9 2 2 2h9c.8 0 1.5-.5 1.8-1.2l3-7.1c.1-.2.2-.5.2-.7z" /></svg>
          <span>AMAT</span>
          <b>DIGALAKKAN</b>
        </div>
        <div id="fx-tech" class="fx">
          <div class="tc" id="fx-tc1"><span class="ic"><svg viewBox="0 0 24 24" fill="#fff"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6c-.6.3-1.2.6-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.3 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" /></svg></span>ORANG TEKNIKAL<svg class="ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#34c56b" /><path d="m6.5 12.5 3.6 3.6 7.4-7.6" stroke="#062612" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
          <div class="tc" id="fx-tc2"><span class="ic"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="7" r="4" /><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z" /></svg></span>BUKAN TEKNIKAL<svg class="ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#34c56b" /><path d="m6.5 12.5 3.6 3.6 7.4-7.6" stroke="#062612" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
          <div id="fx-tc-link"><svg viewBox="0 0 24 24" fill="none" stroke="#ffd23f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3-3M17 17H5l3 3" /></svg>saling berkongsi pandangan</div>
        </div>

        <div id="fx-bw1" class="fx bigw">BER<em>MANFAAT</em>
          <svg class="spark" style="left: -40px; top: -50px" viewBox="0 0 24 24" fill="#ffd23f"><path d="M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0z" /></svg>
          <svg class="spark" style="left: 880px; top: 110px; width: 50px; height: 50px" viewBox="0 0 24 24" fill="#fff"><path d="M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0z" /></svg>
        </div>
        <div id="fx-bw2" class="fx bigw">LEBIH<br />MELUAS
          <div class="ring" id="fx-r1"></div>
          <div class="ring" id="fx-r2"></div>
          <div class="ring" id="fx-r3"></div>
        </div>

        <!-- name cards -->
        <div id="fx-nc-h" class="fx nc"><i class="face face-helmy"></i><div><span>YB Datuk Mohd Noor Helmy</span><b>Timbalan EXCO Sains, Teknologi, Inovasi &amp; Komunikasi Digital Melaka</b></div></div>
        <div id="fx-nc-r" class="fx nc"><i class="face face-rahimah"></i><div><span>Puan Rahimah binti Osman</span><b>Penolong Pegawai, Pejabat Perikanan Negeri Melaka</b></div></div>

        <!-- chrome -->
        <div id="fx-top" class="fx">
          <div id="fx-pill"><div id="fx-dot"></div>ULASAN PENGGUNA</div>
          <div id="fx-chap">
            <div class="chap" id="fx-ch1"><b>01</b>IMPAK</div>
            <div class="chap" id="fx-ch2"><b>02</b>HARAPAN</div>
            <div class="chap" id="fx-ch3"><b>03</b>MASALAH</div>
            <div class="chap" id="fx-ch4"><b>04</b>PENYELESAIAN</div>
            <div class="chap" id="fx-ch5"><b>05</b>MANFAAT</div>
          </div>
        </div>
        <div id="fx-prog" class="fx"></div>

        <!-- title card -->
        <div id="fx-title" class="fx">
          <div id="fx-por-r" class="por"><i class="face face-rahimah"></i></div>
          <div id="fx-por-h" class="por"><i class="face face-helmy"></i></div>
          <div id="fx-t1">APA KATA</div>
          <div id="fx-t2">PENGGUNA?</div>
          <div id="fx-t3">Ulasan sebenar pengguna <b>MCORP Estimate</b></div>
        </div>

        <!-- outro -->
        <div id="fx-out" class="fx">
          <div id="fx-out-glow"></div>
          <img id="fx-out-logo" src="assets/img/logo.png" alt="MCORP Estimate" />
        </div>

        <div id="fx-wipe" class="fx"></div>
        <div id="fx-flash" class="fx"></div>
      </div>
      <script>
        (function () {
          const D = __TOTAL__;
          const T = __TIMES__;
          const tl = gsap.timeline({ paused: true });
          const IR = { immediateRender: false };
          const REST = { x: 0, y: 0, scale: 1, scaleX: 1, rotation: 0 };
          const show = (sel, t, from, dur, ease) => {
            const to = { autoAlpha: 1, duration: dur || 0.45, ease: ease || "back.out(1.7)", immediateRender: false };
            Object.keys(from).forEach((k) => { if (k in REST) to[k] = REST[k]; });
            return tl.fromTo(sel, Object.assign({ autoAlpha: 0 }, from), to, t);
          };
          const hide = (sel, t, to, dur) => tl.to(sel, Object.assign({ autoAlpha: 0, duration: dur || 0.25, ease: "power2.in" }, to || {}), t);
          const flash = (t, a) => {
            tl.fromTo("#fx-flash", { autoAlpha: 0 }, Object.assign({ autoAlpha: a || 0.8, duration: 0.05, ease: "none" }, IR), t);
            tl.to("#fx-flash", { autoAlpha: 0, duration: 0.22, ease: "power2.out" }, t + 0.05);
          };

          // ---- chrome
          show("#fx-top", T.RI0 + 0.1, { y: -40 }, 0.5, "expo.out");
          hide("#fx-top", T.OUT0 - 0.2);
          tl.fromTo("#fx-prog", { autoAlpha: 1, scaleX: 0 }, { autoAlpha: 1, scaleX: 1, duration: D, ease: "none" }, 0);
          [["#fx-ch1", T.RI0 + 0.25, T.CH2], ["#fx-ch2", T.CH2, T.H0], ["#fx-ch3", T.H0 + 0.2, T.CH4], ["#fx-ch4", T.CH4, T.D0], ["#fx-ch5", T.D0, T.OUT0 - 0.2]].forEach(([s, a, b]) => {
            tl.fromTo(s, { autoAlpha: 0, x: -30, rotationX: -90 }, Object.assign({ autoAlpha: 1, x: 0, rotationX: 0, duration: 0.45, ease: "back.out(2)" }, IR), a);
            tl.to(s, { autoAlpha: 0, x: 30, duration: 0.2, ease: "power2.in" }, b - 0.2);
          });

          // ---- title card (opens the film)
          tl.set("#fx-title", { autoAlpha: 1 }, 0);
          show("#fx-por-r", 0.15, { x: -420, rotation: -25 }, 0.6, "expo.out");
          show("#fx-por-h", 0.25, { x: 420, rotation: 25 }, 0.6, "expo.out");
          show("#fx-t1", 0.3, { scale: 2.4 }, 0.35, "expo.out");
          show("#fx-t2", 0.55, { scale: 2.6 }, 0.35, "expo.out");
          show("#fx-t3", 1.05, { y: 30 }, 0.45, "power3.out");
          tl.to("#fx-t1, #fx-t2", { scale: 1.06, duration: 1.9, ease: "sine.out" }, 0.9);
          tl.to("#fx-title", { autoAlpha: 0, scale: 1.25, duration: 0.3, ease: "power2.in" }, T.TTL1 - 0.3);
          flash(T.TTL1 - 0.04, 0.5);

          // ---- 01 impak (Puan Rahimah)
          show("#fx-nc-r", T.RI0 + 0.3, { x: -140 }, 0.55, "expo.out");
          hide("#fx-nc-r", T.RM0 - 0.15, { x: -100 });
          show("#fx-rm", T.RM500 - 0.35, { x: 140 }, 0.5, "expo.out");
          hide("#fx-rm", T.BR1 - 0.25, { x: 100 });
          show("#fx-br1", T.BR1 + 0.25, { x: -120 }, 0.5, "expo.out");
          tl.fromTo("#fx-br1 .br-ok", { autoAlpha: 0, scale: 0.5 }, Object.assign({ autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, IR), T.TIADA + 0.2);
          hide("#fx-br1", T.BR1_OUT - 0.2, { x: -80 });

          // ---- 02 harapan
          show("#fx-rec", T.GALAK - 0.05, { scale: 2.4, rotation: -30 }, 0.4, "expo.out");
          tl.to("#fx-rec", { rotation: -8, duration: 0.3, ease: "power2.out" }, T.GALAK + 0.35);
          hide("#fx-rec", T.BR2 - 0.2, { scale: 0.6 });
          // speaker switch: red wipe across the cut
          tl.fromTo("#fx-wipe", { autoAlpha: 1, xPercent: -100 }, Object.assign({ xPercent: 0, duration: 0.17, ease: "power2.in" }, IR), T.H0 - 0.17);
          tl.to("#fx-wipe", { xPercent: 100, duration: 0.22, ease: "power2.out" }, T.H0);
          tl.set("#fx-wipe", { autoAlpha: 0 }, T.H0 + 0.23);

          // ---- 03 masalah (YB Datuk)
          show("#fx-nc-h", T.H0 + 0.35, { x: -140 }, 0.55, "expo.out");
          hide("#fx-nc-h", T.CHIP1 - 0.6, { x: -100 });
          tl.set("#fx-chips", { autoAlpha: 1 }, T.CHIP1 - 0.1);
          show("#fx-c1", T.CHIP1, { x: -120 }, 0.4);
          show("#fx-c2", T.CHIP2, { x: -120 }, 0.4);
          show("#fx-c3", T.CHIP3, { x: -120 }, 0.4);
          show("#fx-stamp", T.PERTIKAI - 0.05, { scale: 2.6, rotation: -25 }, 0.3, "expo.out");
          hide("#fx-chips", T.RM50 - 0.32, { x: -80 });
          hide("#fx-stamp", T.RM50 - 0.32, { scale: 0.7 });
          // the two price questions
          show("#fx-tag1", T.RM50 - 0.08, { x: -160, rotation: -18, scale: 0.6 }, 0.45);
          tl.to("#fx-tag1", { rotation: -7, duration: 0.3, ease: "power2.out" }, T.RM50 + 0.37);
          show("#fx-tag2", T.RM20 - 0.08, { x: -160, rotation: 16, scale: 0.6 }, 0.45);
          tl.to("#fx-tag2", { rotation: 5, duration: 0.3, ease: "power2.out" }, T.RM20 + 0.37);
          tl.to("#fx-tag1 em, #fx-tag2 em", { scale: 1.25, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, T.Q_OUT - 0.75);
          hide("#fx-tag1", T.Q_OUT - 0.1, { x: -120 });
          hide("#fx-tag2", T.Q_OUT - 0.07, { x: -120 });

          show("#fx-ten", T.TEN - 0.2, { x: -120 }, 0.4, "expo.out");
          tl.fromTo("#fx-ten-s", { autoAlpha: 0, y: 20 }, Object.assign({ autoAlpha: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, IR), T.TEN + 1.1);
          hide("#fx-ten", T.TEN_OUT, { x: -80 });

          // ---- 04 penyelesaian: breakdown UI
          tl.fromTo("#fx-bq", { autoAlpha: 0, x: -200, rotationY: 35, transformPerspective: 1400 }, Object.assign({ autoAlpha: 1, x: 0, rotationY: 10, duration: 0.7, ease: "expo.out" }, IR), T.BQ_IN);
          tl.to("#fx-bq", { rotationY: 4, duration: T.BQ_OUT - T.BQ_IN - 0.7, ease: "sine.inOut" }, T.BQ_IN + 0.7);
          show("#fx-hl-red", T.MAHAL - 0.05, { scaleX: 0.2 }, 0.3, "power3.out");
          show("#fx-tag-mahal", T.MAHAL, { x: -60 }, 0.4);
          show("#fx-hl-grn", T.MURAH - 0.05, { scaleX: 0.2 }, 0.3, "power3.out");
          show("#fx-tag-murah", T.MURAH, { x: -60 }, 0.4);
          tl.to("#fx-hl-red, #fx-hl-grn", { opacity: 0.55, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, T.MURAH + 0.6);
          hide("#fx-bq, #fx-tag-mahal, #fx-tag-murah", T.BQ_OUT, { x: -120 });

          show("#fx-pq-shade", T.C0, {}, 0.3, "none");
          tl.set("#fx-pq", { autoAlpha: 1 }, T.C0);
          tl.fromTo("#fx-pq svg", { autoAlpha: 0, scale: 0.3 }, Object.assign({ autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, IR), T.C0 + 0.05);
          show("#fx-pq1", T.PQ1, { y: 30 }, 0.3, "power3.out");
          show("#fx-pq2", T.PQ2, { scale: 1.6, x: -40 }, 0.3, "expo.out");
          show("#fx-pq3", T.PQ3, { scale: 1.6, x: -40 }, 0.3, "expo.out");
          hide("#fx-pq, #fx-pq-shade", T.D0 - 0.2);
          flash(T.D0 - 0.03, 0.55);

          // ---- 05 manfaat
          show("#fx-tc1", T.TECH1, { x: -140 }, 0.45, "expo.out");
          show("#fx-tc2", T.TECH2, { x: -140 }, 0.45, "expo.out");
          show("#fx-tc-link", T.SALING - 0.1, { y: 20 }, 0.35, "power3.out");
          hide("#fx-tech", T.BR3 - 0.15, { x: -80 });
          show("#fx-bw1", T.MANFAAT - 0.05, { scale: 1.8, x: -60 }, 0.35, "expo.out");
          tl.to("#fx-bw1 .spark", { rotation: 90, scale: 1.3, duration: 1.4, ease: "sine.inOut" }, T.MANFAAT + 0.2);
          hide("#fx-bw1", T.MELUAS - 0.35, { x: -80 });
          show("#fx-bw2", T.MELUAS - 0.05, { scale: 0.6 }, 0.4, "back.out(1.8)");
          ["#fx-r1", "#fx-r2", "#fx-r3"].forEach((s, i) => {
            tl.fromTo(s, { opacity: 0.9, scale: 0.4 }, Object.assign({ opacity: 0, scale: 6, duration: 1.2, ease: "power2.out" }, IR), T.MELUAS + i * 0.3);
          });
          hide("#fx-bw2", T.OUT0 - 0.25);

          // ---- outro: logo only
          tl.fromTo("#fx-out", { autoAlpha: 1, yPercent: 100 }, Object.assign({ yPercent: 0, duration: 0.5, ease: "expo.inOut" }, IR), T.OUT0 - 0.25);
          show("#fx-out-logo", T.OUT0 + 0.3, { scale: 0.6 }, 0.6, "back.out(1.7)");
          tl.to("#fx-out-logo", { scale: 1.05, duration: D - T.OUT0 - 0.9, ease: "sine.out" }, T.OUT0 + 0.9);
          tl.fromTo("#fx-out-glow", { scale: 0.5, opacity: 0 }, Object.assign({ scale: 1.2, opacity: 1, duration: 1.4, ease: "power2.out" }, IR), T.OUT0 + 0.3);

          // live dot pulse + counters driven off one clock so seeking is exact
          const dot = document.getElementById("fx-dot");
          const rmN = document.getElementById("fx-rm-n");
          const rmF = document.getElementById("fx-rm-fill");
          const tenN = document.getElementById("fx-ten-n");
          const fmt = (n) => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          function render(t) {
            const p = (t % 1.2) / 1.2;
            dot.style.boxShadow = `0 0 0 ${(p * 12).toFixed(1)}px rgba(227,38,43,${(0.6 * (1 - p)).toFixed(2)})`;
            const k = Math.min(1, Math.max(0, (t - T.RM500 + 0.1) / 0.9));
            const e = 1 - Math.pow(1 - k, 3);
            rmN.textContent = "RM" + fmt(Math.round((e * 500000) / 1000) * 1000);
            rmF.style.transform = `scaleX(${e.toFixed(3)})`;
            const q = Math.min(1, Math.max(0, (t - T.TEN + 0.2) / 0.55));
            tenN.innerHTML = Math.max(1, Math.round(q * 10)) + "<small> KALI</small>";
          }
          const clock = { t: 0 };
          tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => render(clock.t) }, 0);
          render(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["fx"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
