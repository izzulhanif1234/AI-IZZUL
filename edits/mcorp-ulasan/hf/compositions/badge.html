<!doctype html>
<html lang="ms">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        #bd-stage {
          position: absolute;
          right: 34px;
          top: 28px;
          width: 108px;
          height: 74px;
          perspective: 700px;
        }
        #bd-card {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          transform-style: preserve-3d;
        }
        /* no card: a thin white outline keeps the navy wordmark readable on dark scenes */
        #bd-card img {
          width: 105px;
          height: 70px;
          display: block;
          filter: drop-shadow(0 0 1.5px #ffffff) drop-shadow(0 0 1.5px #ffffff) drop-shadow(0 0 1px #ffffff)
            drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
        }
      </style>
      <div id="root" data-composition-id="badge" data-width="1920" data-height="1080">
        <div id="bd-stage">
          <div id="bd-card">
            <img src="assets/img/mcorp-corporate.png" alt="MCORP Perbadanan Melaka" />
          </div>
        </div>
      </div>
      <script>
        (function () {
          const D = 75.83;
          // hidden over the title card and the outro (which carries its own logo)
          const HIDE = [[-1, 3.0], [71.83, 76.83]];
          const card = document.getElementById("bd-card");
          const stage = document.getElementById("bd-stage");
          const SWING = 28; // degrees each way: turns, never completes a spin
          const PERIOD = 4.2; // seconds per full left-right-left swing
          function vis(t) {
            let v = Math.min(1, t / 0.6);
            HIDE.forEach(([a, b]) => {
              if (t > a - 0.3 && t < b + 0.3) {
                const inFade = Math.min(1, Math.max(0, (t - (a - 0.3)) / 0.3));
                const outFade = Math.min(1, Math.max(0, ((b + 0.3) - t) / 0.3));
                v = Math.min(v, 1 - Math.min(inFade, outFade));
              }
            });
            return v;
          }
          function render(t) {
            const ph = (2 * Math.PI * t) / PERIOD;
            const ry = SWING * Math.sin(ph);
            const rx = 6 * Math.sin(ph * 0.5 + 1.2);
            card.style.transform = `rotateY(${ry.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg)`;
            stage.style.opacity = vis(t).toFixed(3);
          }
          const clock = { t: 0 };
          const tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => render(clock.t) }, 0);
          render(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["badge"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
