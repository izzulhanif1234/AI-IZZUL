<body>
<div id="stage"></div>
<script>
const P=window.PLAN, FPS=P.fps;
const Z={u:['ZON UTARA','#ff7a1f','Daerah Alor Gajah'],t:['ZON TENGAH','#ff2e93','Daerah Melaka Tengah & Jasin'],s:['ZON SELATAN','#22c46e','Perairan selatan Melaka']};
const HERO={masjid:'B',keramat:'B',konet:'B',upeh:'C',melaka:'A',panjang:'A',menatang:'B',burung:'B',peringgi:'C',besar:'C',serimbun:'C',hanyut:'B',lalang:'A',dodol:'A',nangka:'B',undan:'A'};
const still=(k,s)=>`assets/img/cuts-hd/${k}_${s||HERO[k]}.jpg`;
const stage=document.getElementById('stage');
const add=(html)=>{stage.insertAdjacentHTML('beforeend',html);return stage.lastElementChild;};
const ORDER=P.scenes.filter(s=>s.kind==='island').map(s=>s.key);
const pad=n=>String(n).padStart(2,'0');

// ---------- clip frames ----------
const CL={};P.clips.forEach((c,i)=>{c.els=[];c.cur=0;CL[c.key+'_'+c.slot]=c;});
const clipUrl=(c,i)=>`clips/${c.key}_${c.slot}/${String(i).padStart(5,'0')}.jpg`;
window.__pending=[];
function updateClips(t){
  for(const c of P.clips){
    if(!c.els.length)continue;
    const i=Math.max(1,Math.min(c.n,Math.floor((t-c.t0)*FPS)+1));
    if(i===c.cur)continue;c.cur=i;const u=clipUrl(c,i);
    for(const el of c.els){
      if(el.tagName==='IMG'){el.src=u;window.__pending.push(el.decode().catch(()=>{}));}
      else{el.style.backgroundImage=`url(${u})`;const im=new Image();im.src=u;window.__pending.push(im.decode().catch(()=>{}));}
    }
  }
}
const clipImg=(key,slot,cls='full')=>{const im=document.createElement('img');im.className=cls;im.src=still(key,slot);CL[key+'_'+slot].els.push(im);return im;};

// ---------- build scenes ----------
const tl=gsap.timeline({paused:true});
// fromTo tweens never paint at build time; instead every element starts in the from-state of its earliest fromTo (see below)
const REC=[];const _ft=tl.fromTo.bind(tl);tl.fromTo=(t,f,v,p)=>{REC.push({t:gsap.utils.toArray(t),f,at:p});return _ft(t,f,{...v,immediateRender:false},p);};
const show=(el,t0,dur)=>{tl.set(el,{visibility:'visible'},t0).set(el,{visibility:'hidden'},t0+dur);};
const flash=(t,a=.9)=>{tl.fromTo('#flash',{opacity:a},{opacity:0,duration:.3},t);};
const count=(el,to,t,d,fmt=v=>Math.round(v))=>{const o={v:0};tl.to(o,{v:to,duration:d,ease:'power2.out',onUpdate(){el.textContent=fmt(o.v);}},t);};

const builders={
 hook(s){
  const L=add(`<div class="L" id="hook"><div class="bg"></div><div class="shade"></div>
    <div class="abs eyebrow" style="left:122px;top:64px">Selat Melaka · Negeri Melaka</div>
    <div class="gh g1" style="-webkit-text-stroke-color:rgba(255,106,77,.55)">16</div><div class="gh g2" style="-webkit-text-stroke-color:rgba(95,240,226,.55)">16</div>
    <div class="big">16</div><div class="pulau">PULAU</div><div class="wr">satu warisan</div>
    <div class="streak s1" style="left:900px;top:120px;width:700px"></div><div class="streak s2" style="left:980px;top:880px;width:820px"></div>
    <div class="sub">Dari Kuala Linggi hingga ke Pulau Undan, <em>16 pulau</em> menyimpan sejarah, legenda dan khazanah laut Melaka.</div></div>`);

    .fromTo('#taman .c',{rotationY:90,opacity:0},{rotationY:i=>[18,0,-18][i],rotationZ:i=>[-3,0,3][i],opacity:1,duration:.6,stagger:.35,ease:'back.out(1.4)'},T+.8)
    .to(L,{opacity:0,duration:.35},T+s.dur-.35);
  count(L.querySelector('.c1 .v'),18,T+1.2,1);count(L.querySelector('.c2 .v'),4000,T+1.55,1.2,v=>Math.round(v).toLocaleString('en'));
 },
 close(s){
  const L=add(`<div class="L" id="close"><div class="wall"></div><div class="dark"></div>
    <div class="mid"><div class="eyebrow">16 pulau · 3 zon · 1 warisan</div><div class="w"><span>JELAJAH</span> <span style="color:var(--aqua)">·</span> <span style="color:var(--sand)">HARGAI</span> <span style="color:var(--aqua)">·</span> <span>PELIHARA</span></div>
      <div class="s">Pulau-pulau Melaka, khazanah kita bersama.</div></div><div class="lg"><img src="assets/img/mcorp-corporate.png"></div></div>`);
  const w=L.querySelector('.wall');ORDER.forEach(k=>w.insertAdjacentHTML('beforeend',`<div style="background-image:url(${still(k)});border-color:${Z[P.isl[k].z][1]}"></div>`));
  const T=s.t0;show(L,T,s.dur+.5);
  tl.fromTo(w,{x:300,y:100},{x:-200,y:-60,duration:s.dur,ease:'none'},T)
    .fromTo('#close .wall div',{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,stagger:.04,ease:'back.out(1.6)'},T)
    .fromTo('#close .eyebrow',{opacity:0,y:30},{opacity:1,y:0,duration:.4},T+1)
    .fromTo('#close .w span',{opacity:0,y:80,scale:1.4},{opacity:1,y:0,scale:1,duration:.45,stagger:.2,ease:'expo.out'},T+1.2)
    .fromTo('#close .s',{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:1,ease:'power2.out'},T+2.6)
    .fromTo('#close .lg',{y:100,opacity:0},{y:0,opacity:1,duration:.5,ease:'back.out(1.6)'},T+4.5)
    .to('#close .dark',{opacity:.6,duration:.5},T+s.dur-.5);
 },
};
// HUD (rail + logo) shown while islands play
const hud=add(`<div id="hud"><div class="rail">${ORDER.map(k=>`<i id="ra-${k}"></i>`).join('')}</div><div class="bug"><img src="assets/img/mcorp-corporate.png"></div></div>`);
P.scenes.forEach(s=>builders[s.kind](s));
stage.appendChild(hud);
P.scenes.forEach(s=>{tl.set(hud,{visibility:s.kind==='island'?'visible':'hidden'},s.t0);});
add('<div id="flash"></div>');
tl.to({}, {duration:.01},P.total);
const FL=document.getElementById('flash');REC.filter(r=>!r.t.includes(FL)).sort((a,b)=>b.at-a.at).forEach(r=>gsap.set(r.t,r.f));
tl.eventCallback('onUpdate',()=>updateClips(tl.time()));
window.tl=tl;
window.seekTo=async t=>{window.__pending=[];tl.seek(t,false);updateClips(t);await Promise.all(window.__pending);};
const q=new URLSearchParams(location.search);if(q.has('t'))window.seekTo(parseFloat(q.get('t')));
</script>
