<body>
<div id="stage"></div>
<script>
const P=window.PLAN, FPS=P.fps, OV=P.ov;
const Z={u:['ZON UTARA','#ff7a1f','Daerah Alor Gajah'],t:['ZON TENGAH','#ff2e93','Daerah Melaka Tengah & Jasin'],s:['ZON SELATAN','#22c46e','Perairan selatan Melaka']};
const HERO={masjid:'B',keramat:'B',konet:'B',upeh:'C',melaka:'A',panjang:'A',menatang:'B',burung:'B',peringgi:'C',besar:'C',serimbun:'C',hanyut:'B',lalang:'A',dodol:'A',nangka:'B',undan:'A'};
const still=(k,s)=>`assets/img/cuts-hd/${k}_${s||HERO[k]}.jpg`;
const stage=document.getElementById('stage');
const add=html=>{stage.insertAdjacentHTML('beforeend',html);return stage.lastElementChild;};
const ORDER=P.scenes.filter(s=>s.kind==='island').map(s=>s.key);
const pad=n=>String(n).padStart(2,'0');
const topo=(i,cls='')=>`<div class="topo ${cls}">${window.TOPO.bg[i]}</div>`;

// ---------- live clip frames ----------
const CL={};P.clips.forEach(c=>{c.els=[];c.cur=0;CL[c.key+'_'+c.slot]=c;});
const clipUrl=(c,i)=>`clips/${c.key}_${c.slot}/${String(i).padStart(5,'0')}.jpg`;
const frameOf=(c,t)=>Math.max(1,Math.min(c.n,Math.floor((t-c.t0)*FPS)+1));
const CALLOUTS=[];
window.__pending=[];
function updateClips(t){
  for(const c of P.clips){
    if(!c.els.length||t<c.t0-.05||t>c.t0+c.dur+.05)continue;
    const i=frameOf(c,t);if(i===c.cur)continue;c.cur=i;const u=clipUrl(c,i);
    for(const el of c.els){
      if(el.tagName==='IMG'){el.src=u;window.__pending.push(el.decode().catch(()=>{}));}

     <div class="facts">${I.f.map(x=>`<div class="fact"><i style="background:${col}"></i>${x}</div>`).join('')}</div></div>`);
  show(L,T,D+OV);LAYERS.push(L);
  const V=L.querySelector('.v'),imgs=SQ.map(sl=>clipImg(k,sl));imgs.forEach(im=>V.appendChild(im));
  if(s.tr==='slats'){const S=document.createElement('div');S.className='slats';
    for(let i=0;i<8;i++){const d=document.createElement('div');d.style.left=(i*240)+'px';const im=clipImg(k,SQ[0],'');im.style.left=(-i*240)+'px';d.appendChild(im);S.appendChild(d);}
    L.insertBefore(S,V.nextSibling);}
  if(s.tr==='mask'){L.insertAdjacentHTML('beforeend',`<div class="mk"><div class="t">${I.n}</div></div>`);
    const t=L.querySelector('.mk .t');t.style.backgroundImage=`url(${clipUrl(CL[k+'_'+SQ[0]],1)})`;CL[k+'_'+SQ[0]].els.push(t);}
  // mini-map centred on the pin (map at 0.5814x), topo rings around it
  const [px,py]=P.pin[k];Object.assign(L.querySelector('.mm').style,{left:(125-px*.5814)+'px',top:(125-py*.5817)+'px'});
  // transition in
  TR[s.tr](L,O,T);
  // cuts with drift; a flash at each cut
  imgs.forEach((im,i)=>{const a=T+E[i],b=T+E[i+1];
    if(i)tl.set(imgs[i-1],{opacity:0},a).set(im,{opacity:1},a);
    tl.fromTo(im,{scale:1.12,x:i%2?-30:30},{scale:1,x:0,duration:b-a,ease:'none'},a);
    if(i)flash(a,.4,.22);});
  // cut 1: title
  const tb=L.querySelector('.tb');
  tl.fromTo(L.querySelector('.ch'),{x:-120,opacity:0},{x:0,opacity:1,duration:.4,ease:'expo.out'},T+.6)
    .fromTo(tb.querySelector('.nm'),{scale:1.7,opacity:0,transformOrigin:'0% 100%'},{scale:1,opacity:1,duration:.45,ease:'expo.out'},T+.65)
    .fromTo(tb.querySelector('.pl'),{y:30,opacity:0},{y:0,opacity:1,duration:.35},T+.75)
    .fromTo(tb.querySelectorAll('.tg'),{y:40,opacity:0},{y:0,opacity:1,duration:.4,ease:'power3.out'},T+1.0)
    .to(tb,{y:80,opacity:0,duration:.3,ease:'power2.in'},T+E[1]-.3)
    .fromTo(L.querySelector('.cn'),{x:-60,opacity:0},{x:0,opacity:1,duration:.35,ease:'expo.out'},T+E[1]-.1);
  drawTopo(tb.querySelectorAll('.topo path'),T+.6,1.4,.015);
  // cut 2: drone viewfinder + AR callouts + mini-map
  const vf=L.querySelector('.vf');
  tl.fromTo(vf,{opacity:0,scale:1.08},{opacity:1,scale:1,duration:.3,ease:'power2.out'},T+E[1]).to(vf,{opacity:0,duration:.25},T+E[2]-.25)
    .fromTo(L.querySelector('.mini'),{scale:0,rotation:-10,opacity:0},{scale:1,rotation:0,opacity:1,duration:.4,ease:'back.out(1.8)'},T+E[1]+.15);
  drawTopo(L.querySelectorAll('.mini .mt path'),T+E[1]+.3,1.6,.04);
  // callouts pinned to tracked features; s.call sits on the second cut, s.call2 (optional) on another cut
  [s.call,s.call2].filter(Boolean).forEach(([cs,pts])=>{
    const ks=k+'_'+cs,ci=SQ.indexOf(cs),cimg=imgs[ci],base=P.tracks[ks].length-pts.length;
    pts.forEach(([label,x,y,head,flag],j)=>{
      const dir=x>600?'left':'';const down=flag==='down'||y<200||(j===1&&!dir&&!flag);
      const el=document.createElement('div');el.className='co '+dir+(down?' down':'');
      if(label.length>40)el.classList.add('long');
      el.innerHTML=`<div class="pr"></div><div class="ln"></div><div class="dot"></div><div class="bx"><small>${head||pad(s.num)+' · PULAU '+I.n}</small>${label}</div>`;L.appendChild(el);
      CALLOUTS.push({el,ks,p:base+j,img:cimg});
      const t0=T+E[ci]+.3+j*.25;
      tl.fromTo(el.querySelector('.dot'),{scale:0},{scale:1,duration:.3,ease:'back.out(3)'},t0)
        .fromTo(el.querySelector('.pr'),{scale:.3,opacity:1},{scale:2.2,opacity:0,duration:.9,repeat:2,ease:'power2.out'},t0)
        .fromTo(el.querySelector('.ln'),{scaleX:0},{scaleX:1,duration:.25,ease:'power2.out'},t0+.15)
        .fromTo(el.querySelector('.bx'),{opacity:0,y:20,scale:.8},{opacity:1,y:0,scale:1,duration:.3,ease:'back.out(2)'},t0+.3)
        .to(el,{opacity:0,duration:.2},T+E[ci+1]-.2);
    });
  });
  // cut 3 (+4 for Pulau Besar): facts, stories
  const iF=I.here?3:2;
  tl.fromTo(L.querySelectorAll('.fact'),{x:160,opacity:0},{x:0,opacity:1,duration:.4,stagger:.2,ease:'back.out(1.6)'},T+E[iF]+.25);
  if(I.dyk){L.insertAdjacentHTML('beforeend',`<div class="dyk"><div class="q">${I.dyk[2]||'TAHUKAH ANDA?'}</div><h4>${I.dyk[0]}</h4><p>${I.dyk[1]}</p></div>`);
    tl.fromTo(L.querySelector('.dyk'),{y:160,scale:.7,opacity:0},{y:0,scale:1,opacity:1,duration:.5,ease:'back.out(1.7)'},T+E[2]+.3);}
  if(I.chain){L.insertAdjacentHTML('beforeend',`<div class="chain"><div class="in"><div class="old">Catatan Portugis menamakannya<b>“Ilha das Pedras”</b></div>
      <div class="row"><div class="st"><div class="k">01</div><p>Pulau kaya dengan batu laterit</p></div><div class="ar">›</div><div class="st"><div class="k">02</div><p>Portugis membawanya ke darat</p></div><div class="ar">›</div><div class="st" style="border-color:var(--sand)"><div class="k" style="color:var(--sand)">03</div><p>Membina A’Famosa &amp; Gereja St. Paul</p></div></div></div></div>`);
    const C=L.querySelector('.chain');
    tl.to(L.querySelector('.facts'),{opacity:0,duration:.01},T)
      .fromTo(C,{opacity:0},{opacity:1,duration:.3},T+E[2]+.1).fromTo(C.querySelector('.old'),{x:100,opacity:0},{x:0,opacity:1,duration:.4,ease:'expo.out'},T+E[2]+.2)
      .fromTo(C.querySelectorAll('.st,.ar'),{y:60,opacity:0},{y:0,opacity:1,duration:.35,stagger:.25,ease:'back.out(1.8)'},T+E[2]+.5)
      .to(L.querySelector('.mini'),{opacity:0,duration:.2},T+E[2]);}
  if(I.here){L.insertAdjacentHTML('beforeend',`<div class="here"><div class="lab">ANDA DI SINI</div><svg viewBox="0 0 24 32"><path d="M12 31s10-10 10-18A10 10 0 0 0 2 13c0 8 10 18 10 18z" fill="#ff6a4d" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="13" r="4" fill="#fff"/></svg></div>
      <div class="stats"><div class="s"><b>20</b><small>minit</small><p>bot laju dari Jeti Umbai</p></div><div class="s"><b>4.5</b><small>km</small><p>dari Jeti Umbai</p></div><div class="s"><b>2026</b><p>Pusat Informasi Geopark &amp; Taman Laut Negeri Melaka</p></div></div>`);
    tl.fromTo(L.querySelector('.here'),{y:-500},{y:0,duration:.6,ease:'bounce.out'},T+E[2]+.1)
      .fromTo(L.querySelectorAll('.stats .s'),{y:120,opacity:0},{y:0,opacity:1,duration:.45,stagger:.2,ease:'back.out(1.6)'},T+E[2]+.5)
      .to([L.querySelector('.here'),L.querySelector('.stats')],{opacity:0,duration:.25},T+E[3]-.25);}
  if(['dodol','nangka','undan'].includes(k)){L.insertAdjacentHTML('beforeend','<div class="badge">TAMAN LAUT 2022</div>');
    tl.fromTo(L.querySelector('.badge'),{scale:0,rotation:-12},{scale:1,rotation:0,duration:.45,ease:'back.out(2.2)'},T+.9);}
  tl.to(`#ra-${k}`,{background:'#fff',height:12,duration:.2},T+.4).to(`#ra-${k}`,{background:col,height:6,duration:.2},T+D);
 },
 close(s){
  const L=add(`<div class="L" id="close"><div class="wall"></div><div class="dark"></div>${topo(0)}<div class="glow"></div><div class="wm"></div>
    <div class="mid"><div class="eyebrow">16 pulau · 3 zon · 1 warisan</div><div class="w"><span>JELAJAH</span> <span style="color:var(--aqua)">·</span> <span style="color:var(--sand)">HARGAI</span> <span style="color:var(--aqua)">·</span> <span>PELIHARA</span></div>
      <div class="s">Pulau-pulau Melaka, khazanah kita bersama.</div></div></div>`);
  const w=L.querySelector('.wall');P.hook.forEach(([k,sl])=>{const d=document.createElement('div');d.style.borderColor=Z[P.isl[k].z][1];d.appendChild(clipImg('wall-'+k,sl,''));w.appendChild(d);});
  const T=s.t0,O=LAYERS[LAYERS.length-1];show(L,T,s.dur+.5);LAYERS.push(L);
  TR.zoom(L,O,T);
  drawTopo(L.querySelectorAll('.topo path'),T+.5,2.5,.03);
  tl.fromTo(w,{x:300,y:100},{x:-200,y:-60,duration:s.dur,ease:'none'},T)
    .fromTo(w.children,{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,stagger:.04,ease:'back.out(1.6)'},T+.3)
    .fromTo('#close .wm',{opacity:0,scale:1.25},{opacity:.85,scale:1,duration:1.2,ease:'power2.out'},T+.6)
    .fromTo('#close .glow',{opacity:0},{opacity:1,duration:1.2},T+.6)
    .fromTo('#close .eyebrow',{opacity:0,y:30},{opacity:1,y:0,duration:.4},T+1)
    .fromTo('#close .w span',{opacity:0,y:80,scale:1.4},{opacity:1,y:0,scale:1,duration:.45,stagger:.2,ease:'expo.out'},T+1.2)
    .fromTo('#close .s',{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:1,ease:'power2.out'},T+2.6)
    .to(L,{opacity:0,duration:.8},T+s.dur-.8);
 },
};
P.scenes.forEach(s=>builders[s.kind](s));
stage.insertAdjacentHTML('beforeend',`<div id="zfx"></div><div id="wfx"></div><div id="leak"></div>
  <svg id="tfx" viewBox="0 0 1920 1080"><path/><path/><path/><path/></svg>
  <div id="hud"><div class="rail">${ORDER.map(k=>`<i id="ra-${k}"></i>`).join('')}</div></div><div id="flash"></div>`);
tfxPaths=[...document.querySelectorAll('#tfx path')];
const hud=document.getElementById('hud');
P.scenes.forEach(s=>{tl.set(hud,{visibility:s.kind==='island'?'visible':'hidden'},s.t0+(s.kind==='island'?.3:0));});
tl.to({}, {duration:.01},P.total);
const FL=document.getElementById('flash');REC.filter(r=>!r.t.includes(FL)).sort((a,b)=>b.at-a.at).forEach(r=>gsap.set(r.t,r.f));
window.tl=tl;
window.seekTo=async t=>{window.__pending=[];tl.seek(t,false);updateClips(t);await Promise.all(window.__pending);};
const q=new URLSearchParams(location.search);if(q.has('t'))window.seekTo(parseFloat(q.get('t')));
</script>
