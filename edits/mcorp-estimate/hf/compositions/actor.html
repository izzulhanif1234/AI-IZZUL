<!doctype html>

    <template>
      <style>
        #root {

          position: absolute;
          inset: 0;

          object-fit: cover;

          position: absolute;
          left: 96px;
          top: 96px;
          display: flex;
          align-items: center;
          gap: 16px;
          padding: 16px 30px 16px 18px;
          border-radius: 14px;
          background: rgba(6, 17, 43, 0.85);
          box-shadow: 0 0 0 2px rgba(59, 91, 253, 0.8);
          font-family: Montserrat, sans-serif;

          font-size: 42px;

      <div id="root" data-composition-id="actor" data-width="1920" data-height="1080">

      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#ac-wrap", { scale: 1.0 }, { scale: 1.1, duration: 6.25, ease: "none" }, 0);
          tl.fromTo("#ac-chip", { x: -140, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "expo.out" }, 0.25);
          tl.to("#ac-chip", { x: -100, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 5.8);
          window.__timelines = window.__timelines || {};
          window.__timelines["actor"] = tl;
        })();
