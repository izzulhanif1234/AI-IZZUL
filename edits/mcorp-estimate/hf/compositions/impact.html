  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>

        #im-head {
          position: absolute;

        .im-card {

          padding: 40px 40px;

          box-shadow:
            0 0 0 1px rgba(150, 175, 255, 0.22),
            0 30px 60px rgba(0, 0, 0, 0.4);

        .im-band {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 10px;
        }
        .im-who {
          font-family: Montserrat, sans-serif;
          font-weight: 900;
          font-size: 34px;

          margin-top: 50px;

          font-weight: 900;
          font-size: 76px;
          line-height: 1;
          white-space: nowrap;
        }
        .im-num small {
          font-size: 40px;
          margin-right: 6px;
        }
        .im-lbl {
          margin-top: 14px;
          font-family: Montserrat, sans-serif;
          font-weight: 700;
          font-size: 26px;
          letter-spacing: 0.06em;
          color: #ffd23f;
        }
        .im-math {
          position: absolute;
          left: 40px;
          right: 40px;
          bottom: 40px;
          padding-top: 22px;
          border-top: 1px solid rgba(150, 175, 255, 0.25);
          font-size: 24px;
          line-height: 1.5;
          color: #c9d4f5;
        }
        #im-note {
          position: absolute;
          left: 0;
          right: 0;
          top: 880px;
          text-align: center;
          font-size: 22px;
          color: #8b9bc9;
        }
      </style>
      <div id="root" data-composition-id="impact" data-width="1920" data-height="1080">
        <div id="im-glow" data-layout-ignore></div>
        <div id="im-head">
          <div id="im-kicker">IMPAK KEWANGAN</div>
          <div id="im-title">Penjimatan setahun</div>
        </div>
        <div id="im-c1" class="im-card" style="left: 690px">
          <div class="im-band" style="background: #3b5bfd"></div>
          <div class="im-who">MCORP</div>
          <div class="im-sub">Penggunaan dalaman</div>
          <div class="im-num"><small>RM</small><span id="im-n1">0</span></div>
          <div class="im-lbl">SETAHUN</div>
          <div class="im-math">200 tugasan setahun<br />16 jam dijimatkan setiap tugasan</div>
        </div>
        <div id="im-c2" class="im-card" style="left: 690px">
          <div class="im-band" style="background: #22a06b"></div>
          <div class="im-who">Pengguna awam</div>
          <div class="im-sub">Senario meluas · 28 pengguna</div>
          <div class="im-num"><small>RM</small><span id="im-n2">0</span></div>
          <div class="im-lbl">SETAHUN</div>
          <div class="im-math">Kurang bergantung kepada perunding untuk kerja kecil</div>
        </div>
        <div id="im-c3" class="im-card" style="left: 690px">
          <div class="im-band" style="background: #f07a2a"></div>
          <div class="im-who">Agensi kerajaan</div>
          <div class="im-sub">Tanpa unit teknikal · 5 agensi</div>
          <div class="im-num"><small>RM</small><span id="im-n3">0</span></div>
          <div class="im-lbl">SETAHUN</div>
          <div class="im-math">Elak keperluan pengambilan pegawai teknikal</div>
        </div>
        <div id="im-note">*Anggaran berdasarkan andaian penggunaan dalam kertas cadangan MCORP Estimate</div>
      </div>
      <script>
        (function () {
          // local 0 = root 68.6. "Penjimatan" 70.11 (1.51), "Jika" 73.95 (5.35), "lima juta" 76.75 (8.15), "empat ratus" 79.25 (10.65)
          const tl = gsap.timeline({ paused: true });
          tl.to("#im-glow", { scale: 1.15, duration: 13.6, ease: "sine.inOut" }, 0);
          tl.from("#im-kicker", { y: -20, autoAlpha: 0, duration: 0.35, ease: "power3.out" }, 0.1);
          tl.from("#im-title", { y: 30, autoAlpha: 0, duration: 0.45, ease: "back.out(1.6)" }, 0.2);
          tl.set(["#im-c2", "#im-c3"], { autoAlpha: 0 }, 0);
          tl.fromTo("#im-c1", { y: 200, autoAlpha: 0, scale: 0.9 }, { y: 0, autoAlpha: 1, scale: 1.12, duration: 0.6, ease: "back.out(1.4)" }, 0.9);
          // hero slides to the left column, then the two scaled-out scenarios join it
          tl.to("#im-c1", { x: -590, scale: 1, duration: 0.6, ease: "power3.inOut" }, 5.2);
          tl.fromTo("#im-c2", { y: 200, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.55, ease: "back.out(1.4)" }, 5.8);
          tl.fromTo("#im-c3", { x: 590, y: 200, autoAlpha: 0 }, { x: 590, y: 0, autoAlpha: 1, duration: 0.55, ease: "back.out(1.4)" }, 10.0);
          tl.from("#im-note", { autoAlpha: 0, duration: 0.4 }, 6.2);
          const fmt = (v) => Math.round(v).toLocaleString("en-US");
          const count = (sel, to, at, dur) => {
            const o = { v: 0 };
            const el = document.querySelector(sel);
            tl.to(o, { v: to, duration: dur, ease: "power2.out", onUpdate: () => (el.textContent = fmt(o.v)) }, at);
          };
          count("#im-n1", 73125, 1.5, 2.4);
          count("#im-n2", 5090680, 8.1, 1.9);
          count("#im-n3", 429050, 10.6, 1.7);
          tl.to(["#im-c1", "#im-c2", "#im-c3"], { scale: 1.04, duration: 0.2, yoyo: true, repeat: 1, ease: "power1.inOut", stagger: 0.1 }, 12.55);
          tl.to(["#im-head", "#im-c1", "#im-c2", "#im-c3", "#im-note"], { autoAlpha: 0, duration: 0.25 }, 13.35);
          window.__timelines = window.__timelines || {};
          window.__timelines["impact"] = tl;
        })();
      </script>
    </template>
