<!doctype html>
<html lang="ms">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #06112b;
        }
        .hk-wrap {
          position: absolute;
          inset: 0;
          transform-origin: 50% 45%;
        }
        .hk-wrap video {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
        }
        #hk-vignette {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse at 50% 45%, rgba(6, 17, 43, 0) 35%, rgba(6, 17, 43, 0.78) 100%),
            linear-gradient(180deg, rgba(6, 17, 43, 0.55) 0%, rgba(6, 17, 43, 0) 30%);
        }
        .hk-tag {
          position: absolute;
          left: 96px;
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 16px 30px 16px 20px;
          border-radius: 14px;
          background: rgba(6, 17, 43, 0.82);
          box-shadow: 0 0 0 2px rgba(227, 38, 43, 0.7);
          font-family: Montserrat, sans-serif;
          font-weight: 900;
          font-size: 46px;
          letter-spacing: 0.02em;
          color: #fff;
          white-space: nowrap;
        }
        .hk-tag i {
          display: block;
          width: 18px;
          height: 18px;
          border-radius: 50%;
          background: #e3262b;
          box-shadow: 0 0 16px #e3262b;
        }
        #hk-days {
          visibility: hidden;
          opacity: 0;
          position: absolute;
          left: 0;
          right: 0;
          top: 250px;
          text-align: center;
          font-family: Montserrat, sans-serif;
          color: #fff;
          text-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        #hk-days b {
          display: block;
          font-weight: 900;
          font-size: 250px;
          line-height: 0.95;
          letter-spacing: -0.02em;
        }
        #hk-days span {
          display: block;
          font-weight: 800;
          font-size: 64px;
          letter-spacing: 0.32em;
          color: #ffd23f;
        }
        #hk-err {
          visibility: hidden;
          opacity: 0;
          position: absolute;
          left: 0;
          right: 0;
          top: 330px;
          text-align: center;
          font-family: Montserrat, sans-serif;
          font-weight: 900;
          font-size: 108px;
          color: #ff3b3f;
          letter-spacing: 0.01em;
          text-shadow: 0 0 40px rgba(227, 38, 43, 0.6);
          white-space: nowrap;
        }
        #hk-err-r,
        #hk-err-c {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          opacity: 0.55;
          mix-blend-mode: screen;
        }
        #hk-err-r {
          color: #ff0050;
        }
        #hk-err-c {
          color: #00e5ff;
        }
        #hk-flash {
          position: absolute;
          inset: 0;
          background: #f6f8ff;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
        <div id="hk-w1" class="hk-wrap" data-layout-allow-overflow><video id="hk-v1" class="clip" data-hf-media-start-basis="local" src="assets/video/intro1.mp4" data-start="0" data-duration="3.1" data-media-start="2.4" data-track-index="0" muted playsinline></video></div>
        <div id="hk-w2" class="hk-wrap" data-layout-allow-overflow><video id="hk-v2" class="clip" data-hf-media-start-basis="local" src="assets/video/intro1.mp4" data-start="3.1" data-duration="2.9" data-media-start="5.8" data-track-index="0" muted playsinline></video></div>
        <div id="hk-w3" class="hk-wrap" data-layout-allow-overflow><video id="hk-v3" class="clip" data-hf-media-start-basis="local" src="assets/video/intro1.mp4" data-start="6" data-duration="2.9" data-media-start="11.8" data-track-index="0" muted playsinline></video></div>
        <div id="hk-w4" class="hk-wrap" data-layout-allow-overflow><video id="hk-v4" class="clip" data-hf-media-start-basis="local" src="assets/video/intro1.mp4" data-start="8.9" data-duration="3.5" data-media-start="18.5" data-track-index="0" muted playsinline></video></div>
        <div id="hk-vignette"></div>

        <div id="hk-t1" class="hk-tag" style="top: 110px"><i></i>RUJUK SOR SECARA MANUAL</div>
        <div id="hk-t2" class="hk-tag" data-layout-allow-overlap style="top: 110px"><i></i>KIRA KADAR TERBINA, SATU DEMI SATU</div>
        <div id="hk-t3" class="hk-tag" data-layout-allow-overlap style="top: 110px"><i></i>SATU ANGGARAN KOS BQ</div>
        <div id="hk-days"><b>3 HARI</b><span>BEKERJA</span></div>
        <div id="hk-err" data-layout-allow-overlap>TERDEDAH KEPADA RALAT<div id="hk-err-r" aria-hidden="true" data-layout-allow-overlap>TERDEDAH KEPADA RALAT</div><div id="hk-err-c" aria-hidden="true" data-layout-allow-overlap>TERDEDAH KEPADA RALAT</div></div>
        <div id="hk-flash"></div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // slow push on every shot, alternating direction
          [["#hk-w1", 0, 3.1], ["#hk-w2", 3.1, 2.9], ["#hk-w3", 6, 2.9], ["#hk-w4", 8.9, 3.5]].forEach(([s, at, d], i) => {
            tl.fromTo(s, { scale: i % 2 ? 1.12 : 1.0 }, { scale: i % 2 ? 1.0 : 1.12, duration: d, ease: "none" }, at);
          });
          // tags follow the VO: "Merujuk SOR" 0.40, "Mengira" 3.28, "Satu anggaran" 6.00
          const tag = (sel, inAt, outAt) => {
            tl.fromTo(sel, { x: -120, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, ease: "expo.out" }, inAt);
            tl.to(sel, { x: 80, autoAlpha: 0, duration: 0.2, ease: "power2.in" }, outAt);
          };
          tag("#hk-t1", 0.35, 2.95);
          tag("#hk-t2", 3.2, 5.85);
          tag("#hk-t3", 5.95, 8.75);
          // "tiga hari bekerja" 8.92 -> slam
          tl.fromTo("#hk-days", { autoAlpha: 0, scale: 2.2 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 8.9);
          tl.to("#hk-days", { scale: 1.04, duration: 1.05, ease: "sine.out" }, 9.22);
          tl.to("#hk-days", { autoAlpha: 0, y: -60, duration: 0.2, ease: "power2.in" }, 10.3);
          // "kesilapan" 11.28 -> glitching red warning
          tl.fromTo("#hk-err", { autoAlpha: 0, scale: 1.3 }, { autoAlpha: 1, scale: 1, duration: 0.18, ease: "power4.out" }, 10.45);
          [0, 0.08, 0.16, 0.24, 0.9, 0.98, 1.06].forEach((d, i) => {
            const sx = i % 2 ? -10 : 12;
            tl.to("#hk-err-r", { x: sx, duration: 0.04 }, 10.5 + d);
            tl.to("#hk-err-c", { x: -sx, duration: 0.04 }, 10.5 + d);
          });
          tl.to(["#hk-err-r", "#hk-err-c"], { x: 0, duration: 0.05 }, 11.7);
          // white flash out into the title reveal
          tl.to("#hk-flash", { opacity: 1, duration: 0.18, ease: "power2.in" }, 12.22);
          window.__timelines = window.__timelines || {};
          window.__timelines["hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
