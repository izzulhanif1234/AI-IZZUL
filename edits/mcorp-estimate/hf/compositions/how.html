          const tl = gsap.timeline({ paused: true });

          tl.to("#hw-glow", { scale: 1.12, duration: 12.05, ease: "sine.inOut" }, 0);

            tl.to(c, { scale: 1.05, duration: 0.25, ease: "power2.out" }, at[i] + 0.1);
            const off = i < 3 ? at[i + 1] : 10.8;
            tl.to(c + " .hw-ring", { opacity: 0, duration: 0.2 }, off);
            tl.to(c, { scale: 1, duration: 0.25, ease: "power2.inOut" }, off);
